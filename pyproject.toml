[project]
name = "taskmarshal"
version = "0.1.0"
description = "A control plane for reliable coding-agent task lifecycles"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "psycopg[binary]==3.2.10",
  "pydantic==2.11.7",
  "pydantic-ai-slim==0.8.1",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]
worker = ["temporalio==1.16.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/taskmarshal"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend", "worker", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["backend", "worker", "scripts"]
mypy_path = "backend"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["temporalio.*"]
ignore_missing_imports = true
