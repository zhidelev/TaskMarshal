name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check backend worker migrations tests scripts
      - run: uv run ruff format --check backend worker migrations tests scripts
      - run: uv run mypy
      - run: uv run python scripts/check_dependencies.py
      - run: uv run pytest --cov=taskmarshal --cov-report=xml --junitxml=junit.xml
      - run: uv run alembic upgrade head && uv run alembic check && uv run alembic downgrade base
        env:
          DATABASE_URL: sqlite:///./migration-check.db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            coverage.xml
            junit.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  clean-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait
      - run: docker compose exec -T -e TASKMARSHAL_API_URL=http://api:8000 api python scripts/smoke.py
      - if: always()
        run: docker compose logs --no-color > compose.log && docker compose down --volumes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-logs
          path: compose.log
